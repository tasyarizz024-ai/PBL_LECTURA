xt-on-surface font-body-md text-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container"><div class="fixed inset-0 pointer-events-none z-0 overflow-hidden"><div class="absolute -top-24 -left-20 w-[380px] h-[380px] rounded-full bg-primary-fixed/60 blur-[100px] animate-float-slow"></div><div class="absolute top-1/4 -right-28 w-[420px] h-[420px] rounded-full bg-secondary-fixed/50 blur-[110px] animate-float-reverse"></div><div class="absolute top-1/2 -left-16 w-64 h-64 rounded-full bg-tertiary-fixed/40 blur-[80px] animate-float-slow opacity-60"></div><div class="absolute top-2/3 right-1/4 w-72 h-72 rounded-full bg-primary/20 blur-[90px] animate-float-reverse opacity-50"></div><div class="absolute -bottom-24 left-1/4 w-[360px] h-[360px] rounded-full bg-tertiary-fixed/40 blur-[90px] animate-float-slow"></div><div class="absolute -bottom-10 right-4 w-56 h-56 rounded-full bg-secondary/30 blur-[80px] animate-float-reverse opacity-60"></div><div class="absolute inset-0 bg-gradient-to-b from-surface/40 via-surface/80 to-surface backdrop-blur-[1px]"></div></div><main class="relative z-10 min-h-screen flex flex-col justify-between pt-safe pb-safe bg-transparent"><div class="flex flex-col w-full px-margin-mobile pb-space-xl">

<!-- Ambient Lighting Glows Behind Card -->
<div class="absolute -top-12 -left-10 w-52 h-52 rounded-full bg-gradient-to-br from-primary-fixed to-secondary-fixed blur-3xl opacity-70 pointer-events-none animate-float-slow"></div><div class="absolute top-1/3 -left-6 w-32 h-32 rounded-full bg-tertiary-fixed blur-2xl opacity-50 pointer-events-none animate-float-reverse"></div>
<div class="absolute -bottom-10 -right-10 w-56 h-56 rounded-full bg-gradient-to-tl from-secondary-fixed via-primary-fixed/50 to-transparent blur-3xl opacity-65 pointer-events-none animate-float-reverse"></div>
<!-- Main Glassmorphism Authentication Card -->
<div class="relative z-10 w-full backdrop-blur-xl bg-surface-container-lowest/80 rounded-xl shadow-xl shadow-primary/10 p-space-lg flex flex-col items-center">
<!-- Academic Portal Chip -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-primary font-label-sm text-label-sm mb-space-md">
<span class="w-2 h-2 rounded-full bg-primary animate-ping"></span>
<span class="material-symbols-outlined text-[15px]">school</span>
<span class="">Portal Akademik &amp; Presensi Dosen</span>
</div>
<!-- Lectura Brand Identity -->
<div class="w-full flex justify-center items-center py-space-xs mb-space-sm">
<img alt="LECTURA University Portal" class="h-12 max-w-[200px] object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1VG8-93eoJOqknf3mCmWsTpK5EtGceN32QJB3Q7pqWaOIAr0rG7qY0LlJrm_dXRs1iCbFlz2RBU4dBj1--h5K-YamkVPcuE0OOFQS9t3rBnjdG0hDWVcliDSIv1PSkaODXf5OKRR55jCJPbhs1NnHaY7b1ZvhUUIW_CBE0M5v-DkEo8pOu_GULerCuYP8O5sxnsoiNYEkpTAvi_Atuw0rfFbt90-BNa_X2YiTuA12VBwklfdQydmldpeNI">
</div>
<!-- Welcome Headings -->
<div class="text-center w-full mb-space-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Masuk ke Akun</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">
          Pantau ketersediaan &amp; jadwal dosen secara <span class="font-semibold text-primary">real-time</span>
</p>
</div>
<!-- Role Mode Switcher (Tab Delight) -->
<div class="w-full grid p-1 bg-surface-container-low rounded-full mb-space-lg grid-cols-2" role="tablist">
  <button aria-selected="true" class="role-btn py-2 text-center rounded-full font-label-sm text-label-sm transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1" id="tab-mahasiswa" onclick="selectRole('mahasiswa')" role="tab">
    <span class="material-symbols-outlined text-[16px]">person</span>
    <span class="">Mahasiswa</span>
  </button>
  
  <button aria-selected="false" class="role-btn py-2 text-center rounded-full font-label-sm text-label-sm transition-all duration-300 text-on-surface-variant flex items-center justify-center gap-1" id="tab-admin" onclick="selectRole('admin')" role="tab">
    <span class="material-symbols-outlined text-[16px]">manage_accounts</span>
    <span class="">Admin / Staff</span>
  </button>
</div>
<!-- Login Form -->
<form class="w-full space-y-space-md" onsubmit="event.preventDefault(); triggerLogin();">
<!-- Field: Email / NIM / NIP -->
<div class="w-full flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="identifier">
<span id="role-label-text" class="">Email Kampus atau NIM</span>
<span class="text-on-surface-variant/70 text-[11px] font-normal">Wajib diisi</span>
</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">alternate_email</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface-container-lowest/90 text-on-surface placeholder:text-outline-variant font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 transition-all duration-200" id="identifier" placeholder="contoh@univ.ac.id atau 19102..." required="" type="text">
</div>
</div>
<!-- Field: Password -->
<div class="w-full flex flex-col gap-1.5">
<label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="password">
<span class="">Kata Sandi</span>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container font-semibold transition-colors" href="#">Lupa Password?</a>
</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px] pointer-events-none">lock</span>
<input class="w-full pl-11 pr-11 py-3 bg-surface-container-lowest/90 text-on-surface placeholder:text-outline-variant font-body-md text-body-md rounded-lg shadow-sm focus:outline-none focus:bg-surface-container-lowest focus:ring-2 focus:ring-primary/40 transition-all duration-200" id="password" placeholder="Masukkan password akun" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="pwd-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary accent-primary bg-surface-container-low cursor-pointer" type="checkbox">
<span class="font-label-md text-label-md text-on-surface-variant">Ingat sesi saya di perangkat ini</span>
</label>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-6 rounded-full bg-gradient-to-r from-primary via-primary-container to-secondary text-on-primary font-title-md text-title-md shadow-lg shadow-primary/25 hover:shadow-primary/40 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 group" id="btn-submit" type="submit">
<span class="">Masuk Sekarang</span>
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->

<!-- Campus SSO Button -->

<!-- Live Lecturer Pulse Indicator -->

</div>
<!-- Help & Assistance Footer -->
<div class="w-full text-center mt-space-md flex flex-col items-center gap-1.5">
<p class="font-body-md text-body-md text-on-surface-variant">
        Butuh bantuan akses? 
        <a class="font-semibold text-primary underline decoration-primary/40 hover:text-primary-container transition-colors" href="#">Hubungi Layanan IT Kampus</a>
</p>
<div class="flex items-center justify-center gap-3 text-outline text-[12px] pt-1">
<span class="">v2.4.0-academics</span>
<span class="">•</span>
<span class="">Privasi &amp; Keamanan Terjamin</span>
</div>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const pwdInput = document.getElementById('password');
    const pwdIcon = document.getElementById('pwd-icon');
    if (pwdInput.type === 'password') {
      pwdInput.type = 'text';
      pwdIcon.textContent = 'visibility_off';
    } else {
      pwdInput.type = 'password';
      pwdIcon.textContent = 'visibility';
    }
  }

  function selectRole(role) {
    const tabMhs = document.getElementById('tab-mahasiswa');
    const tabDosen = document.getElementById('tab-dosen');
    const labelText = document.getElementById('role-label-text');
    const inputField = document.getElementById('identifier');

    if (role === 'mahasiswa') {
      tabMhs.className = 'role-btn py-2 text-center rounded-full font-label-md text-label-md transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5';
      tabMhs.setAttribute('aria-selected', 'true');
      tabDosen.className = 'role-btn py-2 text-center rounded-full font-label-md text-label-md transition-all duration-300 text-on-surface-variant flex items-center justify-center gap-1.5';
      tabDosen.setAttribute('aria-selected', 'false');
      labelText.textContent = 'Email Kampus atau NIM';
      inputField.placeholder = 'contoh@univ.ac.id atau 19102...';
    } else {
      tabDosen.className = 'role-btn py-2 text-center rounded-full font-label-md text-label-md transition-all duration-300 bg-surface-container-lowest text-primary shadow-sm flex items-center justify-center gap-1.5';
      tabDosen.setAttribute('aria-selected', 'true');
      tabMhs.className = 'role-btn py-2 text-center rounded-full font-label-md text-label-md transition-all duration-300 text-on-surface-variant flex items-center justify-center gap-1.5';
      tabMhs.setAttribute('aria-selected', 'false');
      labelText.textContent = 'NIP Dosen / Email Universitas';
      inputField.placeholder = 'nip.dosen@univ.ac.id atau 198205...';
    }
  }

  function triggerLogin() {
    const btn = document.getElementById('btn-submit');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Memverifikasi...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Berhasil Masuk!</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }, 1600);
    }, 1200);
  }

  function simulateSSO() {
    alert('Mengarahkan ke halaman autentikasi Single Sign-On (SSO) Kampus...');
  }
</script></main>
